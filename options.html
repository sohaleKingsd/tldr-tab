<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>body{font-family:system-ui;padding:16px;max-width:420px}
input{width:100%;margin:4px 0 12px;padding:6px}</style>
</head>
<body>
  <h1>pagebrief options</h1>
  <label>API base</label>
  <input id="base" placeholder="https://api.openai.com/v1" />
  <label>API key</label>
  <input id="key" type="password" />
  <button id="save">Save</button>
  <script>
    chrome.storage.sync.get(['apiBase', 'apiKey']).then((d) => {
      document.getElementById('base').value = d.apiBase || '';
      document.getElementById('key').value = d.apiKey || '';
    });
    document.getElementById('save').onclick = () => {
      chrome.storage.sync.set({
        apiBase: document.getElementById('base').value.trim(),
        apiKey: document.getElementById('key').value.trim(),
      });
    };
  </script>
</body>
</html>
